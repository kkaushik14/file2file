name: Check and deploy File2File
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: file2file-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run build:cloud
      - run: npm run typecheck:cloud
      - run: npm run test:cloud
      - run: npm run build:pages
      - run: npm run test:pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Deploy signaling Worker
        run: npx wrangler deploy --config workers/file-sharing/wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: 70b4b707196e74c4ce9ba179e24d4db0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run build:pages
      - name: Deploy Pages frontend
        run: npx wrangler pages deploy pages-out --project-name file2file-share --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: 70b4b707196e74c4ce9ba179e24d4db0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check public endpoints
        run: node scripts/check-live.mjs
